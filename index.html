<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classificador de Spam</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e8;
    --dim: #666;
    --green: #4cff91;
    --yellow: #ffd84c;
    --red: #ff6b6b;
    --cursor: #e8e8e8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100%;
  }
  body {
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .prompt { color: var(--dim); }
  .prompt span { color: var(--green); }
  .section { margin-top: 1.8rem; }
  .label { color: var(--dim); font-size: 0.85em; margin-bottom: 0.2rem; }
  .divider { border: none; border-top: 1px solid #222; margin: 1.8rem 0; }
  .dim { color: var(--dim); }
  .error { color: var(--red); }

  /* Área de entrada */
  textarea {
    width: 100%;
    min-height: 120px;
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.95em;
    line-height: 1.6;
    padding: 0.8rem;
    resize: vertical;
    outline: none;
    margin-top: 0.4rem;
  }
  textarea:focus { border-color: #555; }
  textarea::placeholder { color: var(--dim); }

  button {
    margin-top: 0.8rem;
    background: none;
    border: 1px solid #444;
    color: var(--fg);
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.95em;
    padding: 0.4rem 1.2rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--green); color: var(--green); }
  button:disabled { opacity: 0.4; cursor: default; border-color: #444; color: var(--fg); }

  /* Resultado */
  .big {
    font-size: 2.2em;
    font-weight: bold;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 0.3rem 0;
  }
  .spam  { color: var(--red); }
  .ham   { color: var(--green); }

  /* Barra de probabilidade */
  .prob-bar-wrap {
    width: 100%;
    height: 6px;
    background: #222;
    margin-top: 0.6rem;
  }
  .prob-bar {
    height: 100%;
    transition: width 0.4s ease;
  }
  .prob-bar.spam { background: var(--red); }
  .prob-bar.ham  { background: var(--green); }

  /* Palavras gatilho */
  .gatilhos {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .gatilho {
    font-size: 0.85em;
    padding: 0.15rem 0.6rem;
    border: 1px solid #333;
    color: var(--fg);
  }
  /* Opacidade proporcional ao peso — aplicada via style inline */

  @media (max-width: 420px) {
    .big { font-size: 1.8em; }
  }
</style>
</head>
<body>

<div class="section">
  <div class="label">texto para classificar</div>
  <textarea id="input" placeholder="Cole a mensagem aqui..."></textarea>
  <button id="btn" onclick="classificar()">classificar</button>
</div>

<div id="resultado"></div>

<script>
async function classificar() {
  const texto = document.getElementById("input").value.trim();
  if (!texto) return;

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "classificando...";

  document.getElementById("resultado").innerHTML = "";

  try {
    const res = await fetch("/classificar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }),
    });

    if (!res.ok) throw new Error(`Erro do servidor (${res.status})`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    renderResultado(data);
  } catch (err) {
    document.getElementById("resultado").innerHTML =
      `<hr class="divider"><div class="section error">erro: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "classificar";
  }
}

function renderResultado(data) {
  const isSpam   = data.predicao === 1;
  const classe   = isSpam ? "spam" : "ham";
  const rotulo   = isSpam ? "🚨 Spam" : "✅ Ham";
  const prob     = data.probabilidade;

  // Normaliza pesos para calcular opacidade visual dos gatilhos
  const maxPeso  = data.gatilhos.length ? data.gatilhos[0].peso : 1;

  // Converte pesos TF-IDF para percentagem relativa ao maior peso do conjunto
  const totalPesos = data.gatilhos.reduce((s, g) => s + g.peso, 0);

  const gatilhosHTML = data.gatilhos.map(g => {
    const opacidade = 0.35 + 0.65 * (g.peso / maxPeso);
    const pct = totalPesos > 0 ? Math.round((g.peso / totalPesos) * 100) : 0;
    return `<span class="gatilho" style="opacity:${opacidade.toFixed(2)}">${g.palavra} <span class="dim">${pct}%</span></span>`;
  }).join("");

  document.getElementById("resultado").innerHTML = `
    <hr class="divider">

    <div class="section">
      <div class="label">resultado</div>
      <div class="big ${classe}">${rotulo}</div>
      <div class="dim">${prob}% de probabilidade de spam</div>
      <div class="prob-bar-wrap">
        <div class="prob-bar ${classe}" style="width:${prob}%"></div>
      </div>
    </div>

    <div class="section">
      <div class="label">palavras que influenciaram a classificação</div>
      <div class="gatilhos">${gatilhosHTML || '<span class="dim">nenhuma palavra reconhecida no vocabulário</span>'}</div>
    </div>

    <hr class="divider">
    <div class="dim" style="font-size:0.8em">modelo: Naive Bayes · vetorizador: TF-IDF · inferência: local</div>
  `;
}

// Permite enviar com Ctrl+Enter
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.ctrlKey) classificar();
});
</script>
</body>
</html>
